name: Deploy Splitwise

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Login to Docker Hub
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3️⃣ Build Docker Image
      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ledgernest:latest .

      # 4️⃣ Push Image to Docker Hub
      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ledgernest:latest

      # 5️⃣ Deploy to your VM
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd splitwise/

            # Pull latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ledgernest:latest

            # Restart container using docker-compose
            sudo docker compose down
            sudo docker compose up -d --remove-orphans  