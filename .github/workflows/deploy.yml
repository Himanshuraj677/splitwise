name: Deploy Splitwise

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Docker Login
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3️⃣ Build Image (UNIQUE TAG)
      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ledgernest:${{ github.sha }} .

      # 4️⃣ Push Image
      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ledgernest:${{ github.sha }}

      # 5️⃣ Deploy via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd splitwise/

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ledgernest:${{ github.sha }}

            # Stop old containers
            sudo docker compose down

            # Start new container (FIXED ENV ISSUE)
            IMAGE=${{ secrets.DOCKER_USERNAME }}/ledgernest:${{ github.sha }} \
            sudo -E docker compose up -d --force-recreate --remove-orphans